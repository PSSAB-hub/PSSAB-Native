name: Build PSSAB Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PSSABNative_AndroidStudio_Project.zip'
      - '.github/workflows/build-apk.yml'
      - '**/*.kt'
      - '**/*.kts'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare project from uploaded ZIP (if present)
        shell: bash
        run: |
          if [ -f "PSSABNative_AndroidStudio_Project.zip" ]; then
            mkdir -p build-source
            unzip -q "PSSABNative_AndroidStudio_Project.zip" -d build-source
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/build-source/PSSABNative" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            echo "Could not find project ZIP or Android project root." >&2
            exit 1
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSSAB-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
